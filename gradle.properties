org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# Built by the shared RKC template build (gradle/ submodule); per-version keys live in versions/<v>/.
fabric_loader_version=0.19.5
loom_version=1.17.19
shadow_version=9.6.1
java_version=25

# Mod Properties
# RKC fork: one patch past the upstream release it is based on (0.12.1), with -rkc.<n>, so it
# outranks that release. A pre-release ranks below its own release: bump it with each upstream merge.
mod_version = 0.12.2-rkc.1
mod_name = FactoryTools
mod_description = Generified bits of code originally created for PolyFactory, now usable for other mods!
mod_authors = ["Patbox"]
mod_website = https://github.com/RainbowKittyClub/FactoryTools
mod_issues = https://github.com/RainbowKittyClub/FactoryTools/issues
mod_license = LGPL-3.0-only

# Project Properties
maven_group = eu.pb4
mod_id = factorytools

# Dependencies
htm_version=1.2.0

# Stonecutter multi-version build, one node per version under versions/<v>/
stonecutter_version=0.9.8
stonecutter_versions=26.3
stonecutter_vcs_version=26.3
dev.kikugie.stonecutter.hard_mode=true
